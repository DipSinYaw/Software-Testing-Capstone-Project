name: Node CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # 1. Create a MongoDB service container inside the runner
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ${secrets.MONGODB_USER}
          MONGO_INITDB_ROOT_PASSWORD: ${secrets.MONGODB_PASS}
    env:
      # MONGODB_USER: ${secrets.MONGODB_USER}
      # MONGODB_PASS: ${secrets.MONGODB_PASS}
      MONGODB_HOST: localhost:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./ecommerce
        run: npm install

      - name: Run test suite
        working-directory: ./ecommerce
        run: npm run test:unit

      - name: Build application
        working-directory: ./ecommerce
        run: npm run build

      - name: Start application
        working-directory: ./ecommerce
        run: |
          npm start &
          npx wait-on http://127.0.0.1:3000

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run load test
        working-directory: ./ecommerce
        run: npm run test:perf